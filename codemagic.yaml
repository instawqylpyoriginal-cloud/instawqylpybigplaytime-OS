workflows:
  ios-unreal-build:
    name: UE5 iOS IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Unreal Project
        script: |
          echo "-> Unreal Engine projesi derleniyor..."
          # Unreal Engine'in macOS üzerindeki BuildCookRun komutu
          # Not: Eğer Unreal Engine özel bir dizindeyse veya source build ise yolunu buraya yazmalısın.
          # Örnek standart Mac BuildCookRun komutu:
          ./Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$CM_BUILD_DIR/MyProject3.uproject" \
            -noP4 -platform=IOS -clientconfig=Shipping -serverconfig=Shipping \
            -cook -build -stage -pak -archive -archivedirectory="$CM_BUILD_DIR/StagedBuilds"
          
      - name: Fix App Structure and Rename to UnrealGame
        script: |
          echo "=== Orijinal .app klasörü UnrealGame formatına uyarlanıyor ==="
          cd $CM_BUILD_DIR
          
          # 1. DerivedData veya build çıktılarındaki herhangi bir App.app klasörünü bul
          APP_DIR=$(find . -type d -name "App.app" | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
              echo "Uyarı: App.app bulunamadı, StagedBuilds kontrol ediliyor..."
              APP_DIR=$(find StagedBuilds -type d -name "*.app" | head -n 1)
          fi
          
          if [ -d "$APP_DIR" ]; then
              PARENT_DIR=$(dirname "$APP_DIR")
              echo "Bulunan klasör: $APP_DIR"
              
              # 2. Klasör adını UnrealGame.app yap
              mv "$APP_DIR" "$PARENT_DIR/UnrealGame.app"
              NEW_APP_PATH="$PARENT_DIR/UnrealGame.app"
              
              # 3. İçindeki çalıştırılabilir binary adını düzenle
              if [ -f "$NEW_APP_PATH/App" ]; then
                  mv "$NEW_APP_PATH/App" "$NEW_APP_PATH/UnrealGame"
              elif [ -f "$NEW_APP_PATH/MyProject3" ]; then
                  mv "$NEW_APP_PATH/MyProject3" "$NEW_APP_PATH/UnrealGame"
              fi
              
              # 4. Info.plist güncellemesi
              PLIST_PATH="$NEW_APP_PATH/Info.plist"
              if [ -f "$PLIST_PATH" ]; then
                  plutil -replace CFBundleExecutable -string "UnrealGame" "$PLIST_PATH"
                  plutil -replace CFBundleName -string "UnrealGame" "$PLIST_PATH"
              fi
          else
              echo "Hata: Hiçbir .app klasörü bulunamadı!"
              exit 1
          fi

      - name: Package Final IPA
        script: |
          echo "=== Hatasız IPA Paketlemesi Yapılıyor ==="
          cd $CM_BUILD_DIR
          
          mkdir -p Payload
          FOUND_APP=$(find . -type d -name "UnrealGame.app" | head -n 1)
          cp -R "$FOUND_APP" Payload/
          
          zip -r UnrealGame_Final.ipa Payload
          echo "IPA başarıyla paketlendi: UnrealGame_Final.ipa"

    artifacts:
      - "UnrealGame_Final.ipa"
      - "**/build/**/*.ipa"
