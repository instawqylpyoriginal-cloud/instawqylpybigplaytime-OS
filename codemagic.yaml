workflows:
  ios-unreal-build:
    name: Unreal Engine iOS Build (Cloud)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        PROJECT_NAME: "instawqylpybigplaytime"
    scripts:
      - name: Check Environment & Project Files
        script: |
          echo "Proje dizini ve dosyalar kontrol ediliyor..."
          ls -la
          # Proje kök dizininde .uproject dosyasının varlığı doğrulanır
          if [ ! -f "$PROJECT_NAME.uproject" ]; then
            echo "Hata: .uproject dosyası bulunamadı!"
            exit 1
          fi
      - name: Run Build Automation
        script: |
          echo "Bulut ortamında paketleme betiği başlatılıyor..."
          # Eğer motor dosyaları depoda yoksa, burada buluttan motor çekme 
          # veya AutomationTool çalıştırma komutları yer almalıdır.
