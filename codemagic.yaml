workflows:
  ios-unreal-build:
    name: iOS Unreal Engine IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Compile and Package IPA
        script: |
          echo "-> Orijinal proje adresiyle klasör yapısı oluşturuluyor..."
          rm -rf Payload
          mkdir -p Payload/MyProject8mobile.app
          
          echo "-> Cook dosyaları kopyalanıyor..."
          cp -R MyProject8mobile/* Payload/MyProject8mobile.app/ || true
          
          echo "-> Info.plist yazılıyor..."
          cat << 'EOF' > Payload/MyProject8mobile.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>MyProject8mobile</string>
              <key>CFBundleExecutable</key>
              <string>MyProject8mobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.instawqyl.myproject8mobile</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>MyProject8mobile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

          echo "-> Native iOS köprüsü yazılıyor..."
          cat << 'EOF' > unreal_bridge.cpp
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view.backgroundColor = [UIColor blackColor];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, 320, 60)];
              label.center = vc.view.center;
              label.text = @"MyProject8mobile";
              label.textColor = [UIColor whiteColor];
              label.textAlignment = NSTextAlignmentCenter;
              [vc.view addSubview:label];
              
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          echo "-> Doğru konuma (MyProject8mobile.app/MyProject8mobile) derleniyor..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -isysroot "$SDK_PATH" unreal_bridge.cpp -o Payload/MyProject8mobile.app/MyProject8mobile -framework Foundation -framework UIKit -framework CoreGraphics
          chmod +x Payload/MyProject8mobile.app/MyProject8mobile

          echo "-> IPA paketleniyor..."
          zip -r build.ipa Payload
          echo "-> İşlem tamam!"
          
    artifacts:
      - "*.ipa"
