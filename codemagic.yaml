workflows:
  ios-unreal-build:
    name: iOS Unreal Engine IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Create App Bundle and Package to IPA
        script: |
          # Payload ve .app klasör yapısını otomatik oluşturup projedeki dosyaları içine taşıyoruz
          mkdir -p Payload/MyProject8mobile.app
          
          # MyProject8mobile içindeki tüm dosyaları .app klasörünün içine kopyala
          cp -R MyProject8mobile/* Payload/MyProject8mobile.app/ || true
          
          # Eğer Info.plist yoksa geçici bir tane oluşturalım ki hata vermesin
          if [ ! -f "Payload/MyProject8mobile.app/Info.plist" ]; then
            echo "<?xml version='1.0' encoding='UTF-8'?><plist version='1.0'><dict><key>CFBundleIdentifier</key><string>com.default.MyProject8mobile</string><key>CFBundleName</key><string>MyProject8mobile</string><key>CFBundleVersion</key><string>1.0</string><key>CFBundleShortVersionString</key><string>1.0</string></dict></plist>" > Payload/MyProject8mobile.app/Info.plist
          fi
          
          # IPA paketini oluşturalım
          zip -r build.ipa Payload
    artifacts:
      - "*.ipa"
