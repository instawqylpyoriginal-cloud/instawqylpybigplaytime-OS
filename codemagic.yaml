workflows:
  ios-unreal-build:
    name: UE5 iOS IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Unreal Project
        script: |
          echo "-> Unreal Engine projesi derleniyor..."
          # Eğer projenin özel bir build komutu varsa buraya gelebilir, 
          # yoksa Codemagic'in varsayılan Unreal derleme adımları burada koşar.
          
      - name: Fix App Structure and Rename to UnrealGame
        script: |
          echo "=== Orijinal .app klasörü UnrealGame formatına uyarlanıyor ==="
          cd $CM_BUILD_DIR
          
          # 1. DerivedData veya build çıktılarındaki herhangi bir App.app klasörünü bul
          APP_DIR=$(find . -type d -name "App.app" | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
              echo "Uyarı: App.app bulunamadı, doğrudan Payload kontrol ediliyor..."
              APP_DIR="Payload/App.app"
          fi
          
          if [ -d "$APP_DIR" ]; then
              PARENT_DIR=$(dirname "$APP_DIR")
              
              echo "Bulunan klasör: $APP_DIR"
              
              # 2. Klasör adını UnrealGame.app yap
              mv "$APP_DIR" "$PARENT_DIR/UnrealGame.app"
              NEW_APP_PATH="$PARENT_DIR/UnrealGame.app"
              
              # 3. İçindeki çalıştırılabilir ana binary dosyasının adını UnrealGame yap (Eğer adı App ise)
              if [ -f "$NEW_APP_PATH/App" ]; then
                  mv "$NEW_APP_PATH/App" "$NEW_APP_PATH/UnrealGame"
                  echo "Binary adı UnrealGame olarak değiştirildi."
              elif [ -f "$NEW_APP_PATH/MyProject" ]; then
                  mv "$NEW_APP_PATH/MyProject" "$NEW_APP_PATH/UnrealGame"
                  echo "Binary adı UnrealGame olarak değiştirildi."
              fi
              
              # 4. Info.plist içindeki CFBundleExecutable ve CFBundleName değerlerini UnrealGame yap
              PLIST_PATH="$NEW_APP_PATH/Info.plist"
              if [ -f "$PLIST_PATH" ]; then
                  plutil -replace CFBundleExecutable -string "UnrealGame" "$PLIST_PATH"
                  plutil -replace CFBundleName -string "UnrealGame" "$PLIST_PATH"
                  echo "Info.plist başarıyla UnrealGame olarak güncellendi."
              fi
          else
              echo "Hata: Hiçbir .app klasörü bulunamadı!"
              exit 1
          fi

      - name: Package Final IPA
        script: |
          echo "=== Hatasız IPA Paketlemesi Yapılıyor ==="
          cd $CM_BUILD_DIR
          
          # Payload klasörünün içinde sadece UnrealGame.app olduğundan emin ol
          mkdir -p final_payload
          
          # UnrealGame.app klasörünü son payload içine taşı
          FOUND_APP=$(find . -type d -name "UnrealGame.app" | head -n 1)
          cp -R "$FOUND_APP" final_payload/
          
          cd final_payload
          zip -r ../UnrealGame_Final.ipa Payload 2>/dev/null || zip -r ../UnrealGame_Final.ipa .
          cd ..
          
          echo "IPA başarıyla paketlendi: UnrealGame_Final.ipa"

    artifacts:
      - "*.ipa"
      - "UnrealGame_Final.ipa"
