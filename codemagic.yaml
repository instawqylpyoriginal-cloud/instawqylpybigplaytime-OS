workflows:
  ios-unreal-build:
    name: iOS Unreal Engine IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Build and Package for iOS on Mac
        script: |
          # Mac ortamında RunUAT.sh scriptini doğru yoldan çalıştırarak iOS paketlemesi başlatıyoruz
          chmod +x ./Engine/Build/BatchFiles/RunUAT.sh
          
          ./Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$PWD/MyProject8mobile/MyProject8mobile.uproject" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -build \
            -stage \
            -package
            
          # Çıkan .app dosyasını bulup Payload'a atalım ve IPA yapalım
          mkdir -p Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r build.ipa Payload
    artifacts:
      - "*.ipa"
