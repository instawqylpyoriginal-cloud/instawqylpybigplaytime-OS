workflows:
  ios-unreal-build:
    name: iOS Unreal Engine IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Find and Package Existing iOS App Bundle
        script: |
          mkdir -p Payload
          
          # Reponun tamamında .app veya .ipa uzantılı her şeyi ara ve bulduklarını Payload'a kopyala
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          # Eğer hazır bir .ipa bulursa onu açıp Payload yapısına dahil et
          find . -name "*.ipa" -exec unzip -o {} -d . \; || true
          
          # Eğer hâlâ Payload boşsa hata vermesin diye boş dosya oluşturmasın, kontrol edelim
          ls -la Payload
          
          zip -r build.ipa Payload
    artifacts:
      - "*.ipa"

