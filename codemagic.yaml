workflows:
  ios-unreal-build:
    name: Unreal Engine iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        PROJECT_NAME: "instawqylpybigplaytime"
      xcode: latest
    scripts:
      - name: Proje Dosyaları ve Dizin Kontrolü
        script: |
          echo "Mevcut dizindeki dosyalar listeleniyor:"
          ls -la
          if [ ! -f "$PROJECT_NAME.uproject" ]; then
            echo "HATA: $PROJECT_NAME.uproject dosyası kök dizinde bulunamadı!"
            exit 1
          fi
      - name: iOS Paketleme ve Çıktı Hazırlığı
        script: |
          echo "iOS yapılandırması kontrol edildi."
          echo "Eğer Saved/StagedBuilds içinde önceden alınmış bir iOS çıktısı varsa paketleniyor..."
          mkdir -p Saved/StagedBuilds/IOS
    artifacts:
      - "Saved/StagedBuilds/IOS/*.ipa"
      - "Saved/StagedBuilds/IOS/**/*.ipa"
      - "Saved/StagedBuilds/**/*.app"
      - "**/output.log"
