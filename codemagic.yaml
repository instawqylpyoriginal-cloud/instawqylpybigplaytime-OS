workflows:
  ios-unreal-build:
    name: iOS Unreal Engine IPA Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Packaging cooked project to IPA
        script: |
          mkdir -p Payload
          
          # Repodaki tüm .app klasörlerini otomatik bul ve Payload içine kopyala
          find . -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          # Eğer Payload dolduysa zip'le
          zip -r build.ipa Payload
    artifacts:
      - "*.ipa"

