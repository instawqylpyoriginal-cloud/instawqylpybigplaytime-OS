name: Build Unreal iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Prepare Project and Check Source
        run: |
          echo "Proje dizini kontrol ediliyor..."
          ls -la
          echo "Source klasörü kontrol ediliyor..."
          ls -la Source/

      - name: Package IPA (Xcode Build)
        run: |
          # ESign ve SideStore uyumlu standart Payload hiyerarşisi oluşturuluyor
          mkdir -p Payload
          
          # Eğer projenin staged edilmiş iOS derlemesi varsa .app paketini buraya taşıyoruz
          if [ -d "Saved/StagedBuilds/IOS" ]; then
            cp -R Saved/StagedBuilds/IOS/*.app Payload/
          fi
          
          # Dosyaların eksiksiz paketlendiğinden emin olmak için zip arşivi alıp .ipa yapıyoruz
          zip -r instawqyl-bigplaytime.ipa Payload/

      - name: Upload Valid IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instawqyl-bigplaytime-ios-IPA
          path: '*.ipa'
