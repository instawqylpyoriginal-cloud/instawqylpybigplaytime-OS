name: Unreal Engine 5.3 iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Disk Alanını ve Sistem Bilgisini Kontrol Et
        run: |
          echo "Mevcut disk alanı:"
          df -h
          echo "Sistem bileşenleri kontrol ediliyor:"
          sw_vers

      - name: Unreal Engine 5.3 Hazırlığı ve Dizin Yapısı
        run: |
          echo "Unreal Engine 5.3 ortamı yapılandırılıyor..."
          mkdir -p Saved/StagedBuilds/IOS
          ls -la

      - name: RunUAT ile iOS Paketlemesi (Simülasyon / Hazırlık)
        run: |
          echo "BuildCookRun süreci tetikleniyor..."
          echo "Proje dizini: $PWD"
          echo "Paketleme altyapısı hazır."

      - name: Oluşan IPA Dosyasını Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: instawqylpybigplaytime-ios-ipa
          path: |
            Saved/StagedBuilds/IOS/**/*.ipa
            Saved/StagedBuilds/IOS/*.ipa
            **/output.log
