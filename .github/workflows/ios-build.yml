name: Package Pre-cooked iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Package iOS IPA from Pre-cooked Build
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Package Pre-cooked Project into IPA
        run: |
          echo "Unreal Engine yolu aranıyor..."
          UE_PATH="/Users/runner/Library/Application Support/Epic/UnrealEngine/5.3"
          
          if [ ! -d "$UE_PATH" ]; then
            UE_PATH="/Applications/Unreal Engine 5.3.2"
          fi

          echo "Proje IPA formatına paketleniyor..."
          "/Users/runner/Shared/Epic Games/UE_5.3/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
            -project="$GITHUB_WORKSPACE/MyProject8mobile.uproject" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Shipping \
            -skipcook \
            -stage \
            -pak \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/StagedBuilds"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instawqyl-bigplaytime-iOS-IPA
          path: StagedBuilds/IOS/*.ipa
