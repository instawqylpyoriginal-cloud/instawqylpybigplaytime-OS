name: Build Unreal iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Unreal Engine Environment
        # Not: Eğer Unreal Engine'i runner üzerinde kuruyorsan veya 
        # projen AutomationTool ile derlenecekse buraya ilgili komutlar gelir.
        run: |
          echo "Proje kök dizini kontrol ediliyor..."
          ls -la
          
      - name: Build iOS Target
        run: |
          # Unreal Engine'in Mac üzerindeki RunUAT aracıyla iOS paketleme komutu
          # Örnek derleme komutu şablona göre projenin yoluna uyarlanır:
          # /Users/runner/Epic\ Games/UE_5.3/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun ...
          echo "C++ altyapısı algılandı, Xcode derlemesi başlatılıyor..."
