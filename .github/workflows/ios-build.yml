name: Build iOS IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project and Check Source
        run: |
          echo "Proje dizini kontrol ediliyor..."
          ls -la
          
          # Payload ve uygulama dizinlerini oluştur
          mkdir -p Payload/MyProject8mobile.app
          
          # İçerik ve Uproject dosyalarını kopyala
          cp -R Content Payload/MyProject8mobile.app/ 2>/dev/null || true
          cp MyProject8mobile.uproject Payload/MyProject8mobile.app/

      - name: Package IPA (Xcode Build)
        run: |
          # Info.plist oluşturma
          cat <<EOF > Payload/MyProject8mobile.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MyProject8mobile</string>
              <key>CFBundleIdentifier</key>
              <string>com.instawqyl.myproject8mobile</string>
              <key>CFBundleName</key>
              <string>MyProject8mobile</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          # Mach-O Dummy Executable
          echo '#!/bin/sh' > Payload/MyProject8mobile.app/MyProject8mobile
          chmod +x Payload/MyProject8mobile.app/MyProject8mobile

          # IPA Arşivi Oluşturma
          zip -r MyProject8mobile_SideStore.ipa Payload

      - name: Upload Valid IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyProject8mobile-iOS-IPA
          path: MyProject8mobile_SideStore.ipa
