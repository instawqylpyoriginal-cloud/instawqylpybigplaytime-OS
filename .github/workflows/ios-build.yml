name: Build Unreal Engine iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unreal Engine & Build IPA
        run: |
          echo "UE5 iOS Paketleme Başlatılıyor..."
          mkdir -p Build/iOS
          echo "Bulut paketleme simülasyonu çalışıyor..." > Build/iOS/MyProject8mobile.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: Build/iOS/*.ipa
