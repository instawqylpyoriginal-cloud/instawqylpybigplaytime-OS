name: UE 5.3 iOS Unsigned IPA Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-unsigned:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epicgames/unreal-engine:dev-slim-5.3.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.EPIC_TOKEN }}
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Cook & Stage iOS Project (Unsigned)
        run: |
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.uproject" | head -n 1)
          echo "Bulunan Proje: $PROJECT_FILE"

          /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/$PROJECT_FILE" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -allmaps \
            -stage \
            -pak \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/BuildOutput" \
            -nocompileeditor \
            -skipbuildeditor \
            -utf8output

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p FinalIPA/Payload
          APP_FOLDER=$(find BuildOutput -name "*.app" | head -n 1)
          
          if [ -n "$APP_FOLDER" ]; then
            cp -r "$APP_FOLDER" FinalIPA/Payload/
            cd FinalIPA
            zip -r ../IstawqylReality_Unsigned.ipa Payload
            echo "İmzasız IPA başarıyla oluşturuldu!"
          else
            echo "Hata: .app klasörü oluşturulamadı."
            exit 1
          fi

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IstawqylReality-iOS-Unsigned
          path: IstawqylReality_Unsigned.ipa
          retention-days: 7
