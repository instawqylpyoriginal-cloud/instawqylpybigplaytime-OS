name: Build Real UE 5.3.2 iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Install UE 5.3.2 & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache & Setup Unreal Engine 5.3.2
        uses: UnrealEngine-Actions/setup-ue@v1
        with:
          engine-version: '5.3.2'

      - name: Run AutomationTool (RunUAT) - Cook & Package iOS
        run: |
          echo "Unreal Engine 5.3.2 ile iOS paketlemesi başlatılıyor..."
          
          # Buluta kurulan Unreal Engine ile projeyi iOS için paketleme komutu
          $UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/MyProject8mobile.uproject" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Shipping \
            -cook \
            -allmaps \
            -stage \
            -pak \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/StagedBuilds"

      - name: Upload Real iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Real-iOS-IPA-UE5.3.2
          path: StagedBuilds/iOS/*.ipa
