name: Package Pre-cooked iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Package iOS IPA from Pre-cooked Build
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unreal Engine Environment
        uses: UnrealEngine-Actions/setup-ue@master
        with:
          engine-version: '5.3.2'

      - name: Package Pre-cooked Project into IPA
        run: |
          echo "Önceden Cook edilmiş iOS paketi IPA haline getiriliyor..."
          $UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/MyProject8mobile.uproject" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Shipping \
            -skipcook \
            -stage \
            -pak \
            -archive \
            -archivedirectory="$GITHUB_WORKSPACE/StagedBuilds"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instawqyl-bigplaytime-iOS-IPA
          path: StagedBuilds/IOS/*.ipa
