name: UE 5.3 iOS Unsigned IPA Build (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios-unsigned:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/epicgames/unreal-engine:dev-slim-5.3.2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.EPIC_TOKEN }}
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Fix Project Config for Linux Cook
        run: |
          # Blueprint-only ve sertifikasiz pisirme ayarlarini garantiye al
          CONFIG_FILE=$(find . -maxdepth 3 -name "DefaultEngine.ini" | head -n 1)
          if [ -n "$CONFIG_FILE" ]; then
            echo "" >> "$CONFIG_FILE"
            echo "[/Script/IOSRuntimeSettings.IOSRuntimeSettings]" >> "$CONFIG_FILE"
            echo "bProjectIsBlueprintOnly=True" >> "$CONFIG_FILE"
            echo "bBuildForDistribution=False" >> "$CONFIG_FILE"
          fi

      - name: Cook & Stage iOS Assets (Bypass SDK & Material Errors)
        run: |
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.uproject" | head -n 1)
          echo "Hedef Proje: $PROJECT_FILE"

          /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildCookRun \
            -project="$GITHUB_WORKSPACE/$PROJECT_FILE" \
            -noP4 \
            -platform=IOS \
            -clientconfig=Development \
            -cook \
            -allmaps \
            -stage \
            -pak \
            -compressed \
            -skipbuild \
            -nocompile \
            -nocompileeditor \
            -skipbuildeditor \
            -IgnoreCookErrors \
            -utf8output \
            -stagingdirectory="$GITHUB_WORKSPACE/BuildOutput"

      - name: Package Payload into Clean Unsigned IPA
        run: |
          mkdir -p FinalIPA/Payload
          # Uretilen .app klasorunu veya StagedBuilds icerigini bul
          APP_FOLDER=$(find BuildOutput -name "*.app" | head -n 1)
          
          if [ -n "$APP_FOLDER" ]; then
            # Turkce karakter sorununu onlemek icin klasor adini sabitle
            cp -r "$APP_FOLDER" FinalIPA/Payload/IstawqylReality.app
            cd FinalIPA
            zip -r ../IstawqylReality_Unsigned.ipa Payload
            echo "Temiz imzasiz IPA basariyla olusturuldu!"
          else
            echo "Hata: .app klasoru olusturulamadi, StagedBuilds kontrol ediliyor..."
            ls -la BuildOutput/IOS || true
            exit 1
          fi

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IstawqylReality-iOS-Unsigned
          path: IstawqylReality_Unsigned.ipa
          retention-days: 7
