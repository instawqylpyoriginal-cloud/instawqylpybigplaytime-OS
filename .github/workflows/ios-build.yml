name: Package Pre-cooked iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Package iOS IPA from Pre-cooked Build
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Dummy / Staged IPA
        run: |
          echo "Pre-cooked iOS verileri paketleniyor..."
          mkdir -p StagedBuilds/IOS
          
          # Engine ve Proje klasörlerini IPA yapısı için zipliyoruz
          cd $GITHUB_WORKSPACE
          zip -r StagedBuilds/IOS/MyProject8mobile.ipa Engine MyProject8mobile MyProject8mobile.uproject

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instawqyl-bigplaytime-iOS-IPA
          path: StagedBuilds/IOS/*.ipa
